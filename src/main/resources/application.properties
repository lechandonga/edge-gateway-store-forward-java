server.port=8080

# ===== 边缘网关 采集-断连补发 配置 =====
# 两种模拟设备协议监听端口
edge.gateway.modbus-port=9001
edge.gateway.json-port=9002
# WAL 持久化目录（重启恢复未确认数据）
edge.gateway.data-dir=data/gateway
# 缓冲硬上限（条数 / 字节），写满策略：block(背压阻塞) 或 reject(隔离 BUFFER_FULL)
edge.gateway.buffer-max-events=10000
edge.gateway.buffer-max-bytes=67108864
edge.gateway.buffer-full-policy=BLOCK
edge.gateway.block-timeout-ms=30000
# 帧与补发
edge.gateway.max-frame-bytes=1024
edge.gateway.batch-size=50
edge.gateway.pump-interval-ms=200
# 重试指数退避：200ms 起，上限 10s，带抖动
edge.gateway.backoff-initial-ms=200
edge.gateway.backoff-max-ms=10000
edge.gateway.backoff-jitter=0.2
# 积压达容量 80% 时暂停读设备 socket 反压
edge.gateway.backpressure-ratio=0.8
# 本地一键演示（4 台模拟设备 + 自动断连/恢复）
edge.gateway.demo-enabled=false
edge.gateway.demo-rate-per-device=2

logging.level.com.github.lechandonga.edgegatewaystoreforwardjava=INFO
