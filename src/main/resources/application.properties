# 管理/观测 HTTP 端口（指标与上游可用性控制）
server.port=8080

# ---- 设备接入 ----
gateway.device-port=9100
gateway.max-frame-bytes=8192
gateway.half-packet-timeout-ms=5000

# ---- 本地持久化缓冲 ----
gateway.data-dir=data/gateway
gateway.buffer-capacity=10000
# 缓冲写满策略：BLOCK=反压（阻塞并最终对设备侧背压）；REJECT_NEW=拒绝新事件并按 BUFFER_FULL 隔离
gateway.overflow-strategy=BLOCK

# ---- 补发 ----
gateway.forward-batch-size=50
gateway.poll-timeout-ms=200
gateway.retry-initial-backoff-ms=200
gateway.retry-max-backoff-ms=10000
gateway.retry-backoff-multiplier=2.0

# ---- 本地模拟上游 ----
gateway.upstream-port=9200
gateway.upstream-initially-available=true
